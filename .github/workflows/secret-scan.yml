name: secret-scan

# 비밀값이 커밋 히스토리에 남아 있지 않은지 본다 (G6).
#
# **이 저장소는 public이다.** 실수로 커밋한 값을 다음 커밋에서 지워도 앞 커밋은
# 그대로 남는다. 그래서 HEAD가 아니라 히스토리 전체를 본다 — `fetch-depth: 0`이
# 없으면 얕은 복제라 검사가 조용히 아무것도 못 본다.
#
# **pull_request에서는 돌리지 않는다.** 포크에서 온 PR에는 Secrets가 내려오지
# 않아 검사할 값이 하나도 없게 되는데, 그때의 초록은 "깨끗하다"가 아니라
# "못 봤다"다. 그 둘이 같은 색이면 검사가 없는 것만 못하다.
# 병합된 뒤 push에서 잡고, 주 1회 다시 훑는다 — 손으로 밀어 넣은 것도 결국 걸린다.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 20 * * 1' # 월요일 05:17 KST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 액션을 태그가 아니라 커밋 SHA로 고정한다. 이 저장소의 다른 워크플로와 같은 이유다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # **검사할 이름을 인자로 못 박는다.** 스크립트가 목록을 쥐고 값이 없으면
      # 건너뛰게 두면, GitHub에 올라가지 않는 값은 영원히 안 보면서 매번
      # 초록이 된다. 이름을 주면 그중 하나라도 비었을 때 실패한다.
      #
      # 여기 넷이 GitHub Secrets에 있는 전부다. CLOUDFLARE_API_TOKEN과
      # GITHUB_DISPATCH_TOKEN은 손으로만 쓰는 값이라 GitHub에 올라가지 않는다 —
      # **그 둘은 CI가 볼 수 없고**, 로컬 `scripts/check-secrets.sh`만 본다.
      # 새 Secret을 추가하면 이 목록에도 넣어야 한다.
      #
      # 스크립트도 워크플로도 값을 출력하지 않는다. GitHub이 로그에서 Secrets를
      # 가려 주기는 하지만, 그것에 기대는 대신 애초에 찍지 않는다.
      - name: 커밋된 적 있는 비밀값
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: >
          bash scripts/scan-history.sh
          DATA_GO_KR_SERVICE_KEY
          R2_ACCESS_KEY_ID
          R2_SECRET_ACCESS_KEY
          CALLBACK_SECRET
