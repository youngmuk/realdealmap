name: geocode-queue

# 배포된 지역의 좌표 사전을 채운다 (T3.6).
#
# 좌표 사전을 채우는 것은 **이 워크플로 하나뿐이다.** publish-region에 채우는
# 경로가 있기는 하지만 갱신(refresh-region)은 지오코더 키를 넘기지 않으므로
# 그쪽에서는 건너뛴다. 처음 보는 지역은 고유 주소가 수천 건이라(강남구 실측 약
# 5,000건) 매 시간 도는 갱신 경로에서 다 처리하면 일간 쿼터를 여러 지역이
# 나눠 쓰다 말라 버리기 때문이다.
#
# 그래서 몰아서 여기서 채운다. 이 작업은 **사전만 쓰고 배포하지 않는다.**
# 좌표를 청크에 굽는 것은 refresh-region 하나뿐이어야 매니페스트 교체가 경합하지 않는다.
# 다 채운 뒤 그 지역의 refresh-region을 깨워 굽게 한다.

on:
  # **리셋 시각을 맞히려 하지 않는다. 자주 두드려서 열린 순간을 줍는다.**
  #
  # 실측(2026-09-08): 쿼터를 다 쓴 상태에서 08:48~11:14 KST 사이 30분 간격으로
  # 물어봤고 전부 막혀 있었다. UTC 자정(09:00 KST)도 KST 자정도 지난 뒤였다.
  # 즉 우리가 아는 어떤 자정도 리셋 시각이 아니다. 하루 한 번짜리 크론은
  # 그 한 번이 닫힌 구간에 걸리면 **그날치를 통째로 버린다** — 실제로 09-08에
  # 09:20 KST 예약 실행이 빈손으로 끝났고, 그날 좌표는 한 건도 늘지 않았다.
  #
  # 막힌 실행은 첫 지역에서 곧바로 끊고 나가므로 대가가 거의 없다:
  # 지오코더 호출 몇 회(10만의 0.003%)와 Actions 시간뿐이고, public 저장소라
  # Actions는 무료다. 추측을 주석에 적는 것보다 여섯 번 두드리는 편이 싸다.
  schedule:
    - cron: '20 */4 * * *'

  workflow_dispatch:
    inputs:
      regions:
        description: '시군구 코드 쉼표 구분 (비우면 R2에 배포된 지역 전부)'
        required: false
        default: ''
        type: string
      budget:
        description: '지역당 지오코더 호출 상한 (카카오·VWorld 합산)'
        required: false
        default: '20000'
        type: string
      republish:
        description: '다 채운 지역의 갱신을 깨워 좌표를 굽게 한다'
        required: false
        default: true
        type: boolean

# 사전 파일은 지역당 하나지만, 두 실행이 겹치면 나중 것이 먼저 것의 항목을 덮는다
# (읽고-합치고-쓰기라 원자적이지 않다). 큐는 하나만 돈다.
concurrency:
  group: geocode-queue
  cancel-in-progress: false

permissions:
  contents: read
  # 다 채운 지역의 refresh-region을 깨우는 데 필요하다.
  actions: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    # 지역당 2만 호출 × 동시 8이면 지역 하나에 몇 분이다. 여러 지역을 돌 수 있게 넉넉히 준다.
    timeout-minutes: 300

    steps:
      # 액션을 태그가 아니라 커밋 SHA로 고정한다. 이 잡은 카카오 키와 R2 자격증명을 쥔다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run typecheck

      - name: 대상 선정
        id: pick
        run: |
          if [ -n "$REGIONS" ]; then
            # 입력을 그대로 믿지 않는다. 5자리 숫자가 아닌 것은 여기서 자른다 —
            # 원천도 카카오도 잘못된 코드에 오류 대신 0건으로 답하기 때문이다(R-14).
            LIST=$(echo "$REGIONS" | tr ',' '\n' | tr -d ' ' | grep -E '^[0-9]{5}$' || true)
            if [ -z "$LIST" ]; then
              echo "::error::쓸 수 있는 시군구 코드가 없습니다: $REGIONS"
              exit 1
            fi
          else
            # 사전이 빈 지역부터 돈다. 코드순으로 돌면 다 채운 서울을 훑느라
            # 쿼터가 남은 채로 실행이 끝난다 — 미착수는 뒤쪽 코드대에 몰려 있다.
            LIST=$(node packages/ingest/scripts/list-published.mjs --need-first)
          fi
          echo "대상 $(echo "$LIST" | wc -l)개"
          {
            echo 'list<<EOF'
            echo "$LIST"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          REGIONS: ${{ inputs.regions }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: 좌표 변환
        id: run
        run: |
          # 한 지역이 실패해도 나머지를 계속한다. 지역 사이에는 의존이 없고,
          # 하나 때문에 멈추면 그날 쿼터를 통째로 버리게 된다.
          filled=""
          failed=""
          quota=0
          # 지역별 출력을 모아 둔다. 실행이 끝난 뒤 "정말 무언가를 만들었는가"를
          # 세기 위해서다 — 로그를 눈으로 읽어야만 알 수 있으면 아무도 안 읽는다.
          ALL="${RUNNER_TEMP:-/tmp}/geocode-all.log"
          ONE="${RUNNER_TEMP:-/tmp}/geocode-one.log"
          : > "$ALL"
          while IFS= read -r code; do
            [ -z "$code" ] && continue
            echo "::group::$code"
            set +e
            node packages/ingest/scripts/geocode-region.mjs "$code" "--budget=$BUDGET" > "$ONE" 2>&1
            rc=$?
            cat "$ONE"
            cat "$ONE" >> "$ALL"
            # 사전만 채우면 지도에는 아무것도 안 바뀐다. 매 시간 갱신은 최근
            # 3개월만 다시 굽기 때문에, 나머지 아홉 달은 좌표 없는 청크로 남는다.
            # 여기서 이어 구워야 적재해 둔 12개월이 전부 지도에 찍힌다.
            #
            # 원천을 부르지 않는다(청크의 raw에서 다시 정규화한다). 붙일 좌표가
            # 없으면 아무것도 올리지 않으므로, 이미 채워진 지역에서는 R2 읽기뿐이다.
            #
            # 배포 경로가 refresh-region과 둘이 된다. 같은 지역이 같은 순간에
            # 겹치면 매니페스트 교체가 경합할 수 있지만, 피해는 한 회차짜리다 —
            # 진 쪽은 다음 실행에서 자기 몫을 다시 올린다.
            if [ "$rc" = 0 ] || [ "$rc" = 2 ]; then
              node packages/ingest/scripts/rebake-region.mjs "$code" ||
                echo "::warning::$code 다시 굽기 실패 (다음 실행에서 재시도)"
            fi
            set -e
            echo "::endgroup::"
            case "$rc" in
              0) filled="$filled $code" ;;
              2) filled="$filled $code"; quota=1
                 echo "::warning::$code 에서 지오코더가 **모두** 막혔습니다. 나머지는 다음 실행으로." ;;
              *) failed="$failed $code"
                 echo "::warning::$code 좌표 변환 실패 (종료 코드 $rc)" ;;
            esac
            # 쓸 수 있는 곳이 하나도 안 남았으면 남은 지역을 돌아도 전부 막힌다.
            # 한 곳만 막힌 것으로는 여기 오지 않는다 — 남은 곳이 이어받는다.
            if [ "$quota" = "1" ]; then
              echo "::notice::쿼터 소진. 남은 지역은 다음 실행으로 넘깁니다."
              break
            fi
          done <<< "$LIST"
          echo "filled=$filled" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

          # **산출물이 0이면 실패다.**
          #
          # 2026-09-08의 실행 #1·#2가 이것 때문에 조용히 지나갔다. 두 번 모두
          # 지오코더를 불렀고(43회·37회) 성공은 0건이었는데 잡은 success로 끝났다.
          # 러너에서 VWorld 연결이 안 되는(HTTP 502 / fetch failed) 상태였고,
          # 회로차단기가 제공자를 접은 뒤 남은 지역이 전부 이월됐다. 지역별로는
          # 경고만 나가므로 결론은 초록이었다. 이 앱이 거듭 당한
          # "오류 없이 아무 일도 안 일어나는" 실패다.
          #
          # 부른 적이 없으면(=채울 게 없어서 0회) 성공 0은 정상이다. 부른 뒤의
          # 0만 실패로 본다.
          calls=$(grep -oE '호출 [0-9]+회' "$ALL" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          found=$(grep -oE '성공 [0-9]+' "$ALL" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')
          echo "합계 — 호출 ${calls}회 · 성공 ${found}건"
          if [ "$calls" -gt 0 ] && [ "$found" -eq 0 ]; then
            echo "::error::지오코더를 ${calls}회 불렀는데 좌표를 한 건도 얻지 못했습니다. 러너에서 지오코더에 닿지 못하는 상태일 수 있습니다(HTTP 502 / fetch failed)."
            exit 1
          fi
        env:
          LIST: ${{ steps.pick.outputs.list }}
          BUDGET: ${{ inputs.budget || '20000' }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          # 카카오가 막히면 이어받는다. 없으면 그냥 카카오만 쓴다 —
          # 예비 경로가 없다는 이유로 본 경로를 막지 않는다.
          VWORLD_KEY: ${{ secrets.VWORLD_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      # 사전만 채웠을 뿐 청크에는 아직 좌표가 없다. 굽는 것은 refresh-region의 일이므로
      # 그쪽을 깨운다. 지역당 concurrency 그룹이 걸려 있어 갱신끼리 겹치지 않는다.
      #
      # 갱신도 자체 보충(기본 2,000회)을 하지만 방금 채운 직후라 대상이 비어 호출이 0이다.
      # 쿼터를 두 번 쓰지 않는다.
      - name: 갱신 깨우기
        if: ${{ inputs.republish != false && steps.run.outputs.filled != '' }}
        continue-on-error: true
        run: |
          for code in $FILLED; do
            gh workflow run refresh-region.yml -f "sggCd=$code" -f months=3 && echo "깨움 $code"
          done
        env:
          FILLED: ${{ steps.run.outputs.filled }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: 결과 판정
        run: |
          if [ -n "$FAILED" ]; then
            echo "::error::좌표 변환에 실패한 지역이 있습니다:$FAILED"
            exit 1
          fi
          echo "완료:$FILLED"
        env:
          FILLED: ${{ steps.run.outputs.filled }}
          FAILED: ${{ steps.run.outputs.failed }}
