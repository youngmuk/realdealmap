name: geocode-queue

# 배포된 지역의 좌표 사전을 채운다 (T3.6).
#
# 갱신(refresh-region)은 매 시간 돌면서 사전을 조금씩만 채운다. 처음 보는 지역은
# 고유 주소가 수천 건이라(강남구 실측 약 5,000건) 갱신 경로에서 다 처리하면
# 카카오 일간 10만 쿼터를 여러 지역이 나눠 쓰다 말라 버린다.
#
# 그래서 밀린 몫은 여기서 몰아서 채운다. 이 작업은 **사전만 쓰고 배포하지 않는다.**
# 좌표를 청크에 굽는 것은 refresh-region 하나뿐이어야 매니페스트 교체가 경합하지 않는다.
# 다 채운 뒤 그 지역의 refresh-region을 깨워 굽게 한다.

on:
  # 카카오 쿼터는 UTC 자정에 새로 열린다. 그 직후에 돌려 하루치를 온전히 쓴다.
  schedule:
    - cron: '20 0 * * *'

  workflow_dispatch:
    inputs:
      regions:
        description: '시군구 코드 쉼표 구분 (비우면 R2에 배포된 지역 전부)'
        required: false
        default: ''
        type: string
      budget:
        description: '지역당 카카오 호출 상한'
        required: false
        default: '20000'
        type: string
      republish:
        description: '다 채운 지역의 갱신을 깨워 좌표를 굽게 한다'
        required: false
        default: true
        type: boolean

# 사전 파일은 지역당 하나지만, 두 실행이 겹치면 나중 것이 먼저 것의 항목을 덮는다
# (읽고-합치고-쓰기라 원자적이지 않다). 큐는 하나만 돈다.
concurrency:
  group: geocode-queue
  cancel-in-progress: false

permissions:
  contents: read
  # 다 채운 지역의 refresh-region을 깨우는 데 필요하다.
  actions: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    # 지역당 2만 호출 × 동시 8이면 지역 하나에 몇 분이다. 여러 지역을 돌 수 있게 넉넉히 준다.
    timeout-minutes: 300

    steps:
      # 액션을 태그가 아니라 커밋 SHA로 고정한다. 이 잡은 카카오 키와 R2 자격증명을 쥔다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run typecheck

      - name: 대상 선정
        id: pick
        run: |
          if [ -n "$REGIONS" ]; then
            # 입력을 그대로 믿지 않는다. 5자리 숫자가 아닌 것은 여기서 자른다 —
            # 원천도 카카오도 잘못된 코드에 오류 대신 0건으로 답하기 때문이다(R-14).
            LIST=$(echo "$REGIONS" | tr ',' '\n' | tr -d ' ' | grep -E '^[0-9]{5}$' || true)
            if [ -z "$LIST" ]; then
              echo "::error::쓸 수 있는 시군구 코드가 없습니다: $REGIONS"
              exit 1
            fi
          else
            LIST=$(node packages/ingest/scripts/list-published.mjs)
          fi
          echo "대상 $(echo "$LIST" | wc -l)개"
          {
            echo 'list<<EOF'
            echo "$LIST"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          REGIONS: ${{ inputs.regions }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: 좌표 변환
        id: run
        run: |
          # 한 지역이 실패해도 나머지를 계속한다. 지역 사이에는 의존이 없고,
          # 하나 때문에 멈추면 그날 쿼터를 통째로 버리게 된다.
          filled=""
          failed=""
          quota=0
          while IFS= read -r code; do
            [ -z "$code" ] && continue
            echo "::group::$code"
            set +e
            node packages/ingest/scripts/geocode-region.mjs "$code" "--budget=$BUDGET"
            rc=$?
            # 사전만 채우면 지도에는 아무것도 안 바뀐다. 매 시간 갱신은 최근
            # 3개월만 다시 굽기 때문에, 나머지 아홉 달은 좌표 없는 청크로 남는다.
            # 여기서 이어 구워야 적재해 둔 12개월이 전부 지도에 찍힌다.
            #
            # 원천을 부르지 않는다(청크의 raw에서 다시 정규화한다). 붙일 좌표가
            # 없으면 아무것도 올리지 않으므로, 이미 채워진 지역에서는 R2 읽기뿐이다.
            #
            # 배포 경로가 refresh-region과 둘이 된다. 같은 지역이 같은 순간에
            # 겹치면 매니페스트 교체가 경합할 수 있지만, 피해는 한 회차짜리다 —
            # 진 쪽은 다음 실행에서 자기 몫을 다시 올린다.
            if [ "$rc" = 0 ] || [ "$rc" = 2 ]; then
              node packages/ingest/scripts/rebake-region.mjs "$code" ||
                echo "::warning::$code 다시 굽기 실패 (다음 실행에서 재시도)"
            fi
            set -e
            echo "::endgroup::"
            case "$rc" in
              0) filled="$filled $code" ;;
              2) filled="$filled $code"; quota=1
                 echo "::warning::$code 에서 카카오 쿼터에 막혔습니다. 나머지는 다음 실행으로." ;;
              *) failed="$failed $code"
                 echo "::warning::$code 좌표 변환 실패 (종료 코드 $rc)" ;;
            esac
            # 쿼터가 이미 바닥났으면 남은 지역을 돌아도 전부 429다. 헛돌지 않는다.
            if [ "$quota" = "1" ]; then
              echo "::notice::쿼터 소진. 남은 지역은 다음 실행으로 넘깁니다."
              break
            fi
          done <<< "$LIST"
          echo "filled=$filled" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
        env:
          LIST: ${{ steps.pick.outputs.list }}
          BUDGET: ${{ inputs.budget || '20000' }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      # 사전만 채웠을 뿐 청크에는 아직 좌표가 없다. 굽는 것은 refresh-region의 일이므로
      # 그쪽을 깨운다. 지역당 concurrency 그룹이 걸려 있어 갱신끼리 겹치지 않는다.
      #
      # 갱신도 자체 보충(기본 2,000회)을 하지만 방금 채운 직후라 대상이 비어 호출이 0이다.
      # 쿼터를 두 번 쓰지 않는다.
      - name: 갱신 깨우기
        if: ${{ inputs.republish != false && steps.run.outputs.filled != '' }}
        continue-on-error: true
        run: |
          for code in $FILLED; do
            gh workflow run refresh-region.yml -f "sggCd=$code" -f months=3 && echo "깨움 $code"
          done
        env:
          FILLED: ${{ steps.run.outputs.filled }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: 결과 판정
        run: |
          if [ -n "$FAILED" ]; then
            echo "::error::좌표 변환에 실패한 지역이 있습니다:$FAILED"
            exit 1
          fi
          echo "완료:$FILLED"
        env:
          FILLED: ${{ steps.run.outputs.filled }}
          FAILED: ${{ steps.run.outputs.failed }}
