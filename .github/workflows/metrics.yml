name: metrics

# 운영 지표를 하루 한 번 모아 잡 요약과 아티팩트로 남긴다 (T6.5).
#
# **지표 저장소를 따로 두지 않는다.** 무료 구성에 관측 서비스를 붙이면 그것이
# 또 하나의 운영 대상이 되고, 어긋나기 시작하면 어느 쪽이 진실인지 알 수 없다.
# 여기서 내는 값은 전부 지금 R2와 Actions API에 있는 것에서 계산한다.

on:
  schedule:
    - cron: '40 21 * * *' # UTC 21:40 = KST 06:40
  workflow_dispatch:

permissions:
  contents: read
  # 배치 성공률을 세려면 워크플로 실행 이력을 읽어야 한다.
  actions: read

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run typecheck

      - name: R2 지표
        run: node packages/ingest/scripts/report-metrics.mjs --months=12 > /tmp/metrics.md
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: 배치 성공률
        run: |
          since=$(date -u -d '7 days ago' +%Y-%m-%d)
          api() {
            curl -sS -H "authorization: Bearer $GH_TOKEN" \
              -H 'accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$1"
          }

          # 7일치를 쪽 단위로 전부 모은다. 한 쪽(100건)만 보던 때는 앱이 부르는
          # refresh-region이 하루 60건을 넘기면서 이틀치도 안 담겼다.
          # 워크플로가 한 번도 안 돌았으면 404라 비어 있는 채로 끝난다.
          runs_of() {
            local page=1 all='[]' batch
            while [ "$page" -le 10 ]; do
              batch=$(api "actions/workflows/$1/runs?per_page=100&page=$page&created=>=$since")
              echo "$batch" | jq -e '.workflow_runs' > /dev/null 2>&1 || break
              # 시험 실행은 아무것도 올리지 않으므로 세지 않는다. 남겨 두면 원천에
              # 닿지 못한 시험 실행이 재시도 없이 성공으로 끝나 "배포"로 잡힌다.
              all=$(jq -c --argjson a "$all" \
                '$a + [.workflow_runs[] | select(.display_title | endswith("(시험)") | not)
                       | {id, conclusion, title: .display_title}]' <<< "$batch")
              [ "$(jq '.workflow_runs | length' <<< "$batch")" -lt 100 ] && break
              page=$((page + 1))
            done
            echo "$all"
          }

          {
            echo ""
            echo "### 배치 (최근 7일)"
            echo ""
            echo "| 워크플로 | 요청 | 배포 | 원천 불통 | 실패 | 성공률 |"
            echo "| --- | --- | --- | --- | --- | --- |"
          } >> /tmp/metrics.md

          for wf in refresh-region.yml backfill.yml; do
            runs=$(runs_of "$wf")
            ok=$(jq '[.[] | select(.conclusion=="success")] | length' <<< "$runs")
            bad=$(jq '[.[] | select(.conclusion=="failure" or .conclusion=="timed_out")] | length' <<< "$runs")
            total=$((ok + bad))
            requests=$total; deployed=$ok; down='—'

            # refresh-region은 원천 불통을 성공으로 끝내고 새 러너에서 한 번 더 돈다.
            # 결론만 세면 불통이 성공으로 잡히므로 풀어서 센다.
            #   재시도 실행 수 = 1차에서 닿지 못한 수 (하나당 재시도가 하나)
            #   재시도에서도 닿지 못한 수 = 재시도 실행 중 "원천 불통" 단계가 돈 것
            # 잡 조회는 재시도 실행에만 한다. 전부 조회하면 토큰 한도(시간당 1,000)에 닿는다.
            if [ "$wf" = refresh-region.yml ] && [ "$total" -gt 0 ]; then
              retried=$(jq '[.[] | select(.title | endswith("(재시도)"))] | length' <<< "$runs")
              still=0
              for id in $(jq -r '.[] | select((.title | endswith("(재시도)")) and .conclusion=="success") | .id' <<< "$runs"); do
                step=$(api "actions/runs/$id/jobs" | jq -r '[.jobs[].steps[]? | select(.name=="원천 불통") | .conclusion] | first // ""')
                [ "$step" = success ] && still=$((still + 1))
              done
              requests=$((total - retried))
              deployed=$((ok - retried - still))
              down="$still (재시도 $retried)"
            fi

            if [ "$requests" -le 0 ]; then
              rate='실행 없음'
            else
              rate=$(awk "BEGIN{printf \"%.1f%%\", $deployed*100/$requests}")
            fi
            echo "| $wf | $requests | $deployed | $down | $bad | $rate |" >> /tmp/metrics.md
          done

          # 아직 못 재는 것은 못 잰다고 적는다. 표에 없으면 괜찮은 줄로 읽힌다.
          {
            echo ""
            echo "### 아직 재지 못하는 것"
            echo ""
            echo "| 지표 | 막힌 이유 |"
            echo "| --- | --- |"
            echo "| 캐시 적중률 | 사용자 지정 도메인 전환(T6.3) 뒤에 Cloudflare 분석에서 볼 수 있다 |"
            echo "| 국토부 쿼터 사용량 | 원천이 잔여량을 응답에 주지 않는다. 배포 로그의 호출 수로 추정한다 |"
            echo "| 해시 실패율 | 수집 시점에만 관측된다. 배포가 보류로 끝난 횟수가 대리 지표다 |"
          } >> /tmp/metrics.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 요약에 붙인다
        run: cat /tmp/metrics.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metrics
          path: /tmp/metrics.md
          retention-days: 90
