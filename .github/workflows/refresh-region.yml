name: refresh-region

# 실행 목록과 실패 메일 제목에서 어느 지역인지, 자동 재시도·시험 실행인지 바로 보이게 한다.
# 지표(metrics.yml)가 끝의 "(재시도)"로 재시도를 세고 "(시험)"을 뺀다 — 바꾸면 거기도 고친다.
# sggCd는 Worker가 카탈로그로 검증한 뒤에만 보낸다(policy.ts isValidSggCd).
run-name: "refresh-region ${{ inputs.sggCd || github.event.client_payload.sggCd }}${{ inputs.attempt == '2' && ' (재시도)' || '' }}${{ inputs.dryRun && ' (시험)' || '' }}"

# 한 시군구의 최근 N개월을 수집해 R2에 배포한다.
#
# 갱신 단위가 시군구인 이유는 매니페스트가 지역 단위이기 때문이다.
# 앱은 `v1/regions/{sggCd}/manifest.json` 하나를 보고 TTL을 판정하므로,
# 그 파일을 바꾸는 작업이 이 워크플로 하나로 모여 있어야 경쟁이 생기지 않는다.

on:
  # Worker가 앱의 갱신 요청을 받아 여기로 넘긴다(AD-5).
  # workflow_dispatch와 입력 이름이 다르므로 아래에서 하나로 합친다.
  repository_dispatch:
    types: [refresh-region]

  workflow_dispatch:
    inputs:
      sggCd:
        description: '시군구 코드 5자리 (예: 11680 강남구). 폐지 코드를 넣으면 현행 코드로 보정된다'
        required: true
        type: string
      months:
        description: '최근 몇 개월분을 배포할지'
        required: false
        default: '3'
        type: string
      dryRun:
        description: '올리지 않고 계획만 확인한다'
        required: false
        default: false
        type: boolean
      # 사람이 넣을 일은 없다. 원천에 닿지 못한 실행이 스스로를 다시 부를 때
      # 2를 넣어, 재시도가 또 재시도를 부르지 않게 한다.
      attempt:
        description: '자동 재시도 회차 (비워 두세요)'
        required: false
        default: '1'
        type: string

# 같은 지역을 동시에 갱신하면 매니페스트가 서로를 덮어쓴다.
#
# cancel-in-progress를 **끄는 것이 중요하다.** 진행 중인 실행을 취소하면
# 청크는 올라갔는데 매니페스트는 안 바뀐 상태에서 끊길 수 있다. 그 자체는 안전하지만
# (매니페스트가 옛 청크를 가리키므로 앱은 멀쩡하다) 헛돈 호출이 쿼터를 먹는다.
# 뒤에 온 실행을 기다리게 하는 편이 낫다 — 어차피 같은 지역의 중복 갱신은 무의미하다.
concurrency:
  group: sgg-${{ inputs.sggCd || github.event.client_payload.sggCd }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      code: ${{ steps.publish.outputs.code }}

    steps:
      # 액션을 태그가 아니라 커밋 SHA로 고정한다.
      #
      # `@v4`는 움직이는 태그다. 액션 저장소가 탈취되면 태그를 재바인딩하는 것만으로
      # 이 잡에 임의 코드가 들어오고, 그 잡은 국토부 인증키와 R2 자격증명을 쥐고 있다.
      # 공식 액션이라 확률은 낮지만 대가가 크고, 액션이 둘뿐이라 유지 비용은 거의 없다.
      #
      # 갱신할 때는 태그가 가리키는 SHA를 직접 확인하고 옆의 주석도 함께 고친다.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      # 스크립트가 dist를 import한다. typecheck가 곧 빌드다(tsc --build).
      - name: 빌드
        run: npm run typecheck

      - name: 입력 검증
        # 원천은 잘못된 요청에도 200·0건으로 답한다(R-14). 오타가 "거래 없음"으로
        # 위장되므로 워크플로 입구에서 형식부터 막는다.
        run: |
          if ! [[ "$SGG_CD" =~ ^[0-9]{5}$ ]]; then
            echo "::error::시군구 코드가 5자리 숫자가 아닙니다: $SGG_CD"
            exit 1
          fi
          if ! [[ "$MONTHS" =~ ^([1-9]|1[0-2])$ ]]; then
            echo "::error::개월 수가 1~12가 아닙니다: $MONTHS"
            exit 1
          fi
        env:
          SGG_CD: ${{ inputs.sggCd || github.event.client_payload.sggCd }}
          MONTHS: ${{ inputs.months || github.event.client_payload.months || '3' }}

      - name: 수집 및 배포
        id: publish
        run: |
          set +e
          node packages/ingest/scripts/publish-region.mjs "$SGG_CD" "--months=$MONTHS" ${DRY_RUN:+--dry-run}
          echo "code=$?" >> "$GITHUB_OUTPUT"
        env:
          SGG_CD: ${{ inputs.sggCd || github.event.client_payload.sggCd }}
          MONTHS: ${{ inputs.months || github.event.client_payload.months || '3' }}
          DRY_RUN: ${{ inputs.dryRun && '1' || '' }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      # 스크립트는 종료 코드로 상황을 구분한다. 무엇 때문에 멈췄는지가
      # 로그를 열지 않고도 보여야 한다.
      #   0 정상 · 2 배포 보류(의도한 중단) · 3 수집 이슈 · 4 원천 불통 · 그 외 오류
      #
      # 보류를 실패로 올리는 것은 의도다. 매니페스트가 그대로라 서비스는 멀쩡하지만
      # 원천에 무슨 일이 생겼다는 뜻이므로 사람이 봐야 한다.
      #
      # 원천 불통은 실패로 올리지 **않는다.** 2026-09-09부터 이 워크플로의 실패
      # 메일은 전부 이것(24건)이었고, 사람이 할 수 있는 일이 없었다.
      # 같은 분에 돈 다른 실행은 닿았으므로 원천이 죽은 것이 아니라 그 러너가
      # 못 닿은 것으로 본다 — 그래서 아래 retry 잡이 새 러너에서 한 번 더 돈다.
      # 매니페스트는 그대로라 앱은 옛 자료를 계속 보고, 지표가 따로 센다.
      - name: 결과 판정
        run: |
          # 시험 실행은 아무것도 올리지 않는다. 로그만 보는 사람이 "배포됐다"로
          # 오해하지 않도록 메시지 자체에 표시한다.
          if [ -n "$DRY_RUN" ]; then
            LABEL="[시험 실행] "; DONE="시험 실행이라 배포하지 않았습니다."
          else
            LABEL=""; DONE="배포 자체는 되었습니다."
          fi
          case "$CODE" in
            0) echo "${LABEL}배포 완료" ;;
            2) echo "::error::${LABEL}배포가 보류되었습니다. 매니페스트는 그대로입니다 — 원천 이상을 먼저 확인하세요."
               exit 1 ;;
            3) echo "::warning::${LABEL}수집 중 이슈가 있었습니다(정규화 실패 또는 스키마 변화). ${DONE}"
               ;;
            4) echo "::warning::${LABEL}원천(apis.data.go.kr)에 닿지 못했습니다 — 우리 쪽 고장이 아닙니다. 매니페스트는 그대로입니다."
               ;;
            *) echo "::error::${LABEL}실행이 실패했습니다 (종료 코드 $CODE)"
               exit 1 ;;
          esac
        env:
          CODE: ${{ steps.publish.outputs.code }}
          DRY_RUN: ${{ inputs.dryRun && '1' || '' }}

      # 원천 불통은 잡이 성공으로 끝나므로 실행 결론만으로는 안 보인다.
      # 지표(metrics.yml)가 **이 단계가 돌았는지**로 센다 — 이름을 바꾸면 거기도 고친다.
      - name: 원천 불통
        if: steps.publish.outputs.code == '4'
        run: |
          if [ -n "$DRY_RUN" ]; then
            echo "시험 실행이라 다시 돌리지 않습니다."
          elif [ "$ATTEMPT" = "2" ]; then
            echo "재시도에서도 원천에 닿지 못했습니다. 앱이 60분 뒤 다시 요청합니다."
          else
            echo "새 러너에서 한 번 더 돌립니다(retry 잡)."
          fi
        env:
          ATTEMPT: ${{ inputs.attempt || '1' }}
          DRY_RUN: ${{ inputs.dryRun && '1' || '' }}

      # 갱신이 끝났음을 Worker에 알린다.
      #
      # 잠금을 푸는 것이 목적이 아니다 — 최소 간격(60분)이 잠금 만료(30분)보다 길어서
      # 잠금이 게이트를 좌우한 적은 없다. 값어치는 **앱에게 사실대로 답하는 것**이다.
      # 콜백이 없으면 40초 전에 끝난 갱신을 두고 "지금 돌고 있다"고 알려주게 된다.
      #
      # `always()`라 실패·보류로 끝나도 반드시 보낸다. 여기서 안 보내면 그 지역이
      # 실제로는 멈췄는데 도는 것처럼 보인다.
      - name: 완료 알림
        if: always() && env.CALLBACK_SECRET != ''
        continue-on-error: true
        run: |
          # 본문은 jq로 만든다. 셸 안에서 JSON을 따옴표로 조립하면
          # 값에 따옴표가 섞였을 때 조용히 깨진다.
          body=$(jq -nc --arg s "$SGG_CD" --arg o "$OUTCOME" '{sggCd:$s, outcome:$o}')
          code=$(curl -sS -X POST "$WORKER_URL/v1/refresh/done" -H "authorization: Bearer $CALLBACK_SECRET" -H 'content-type: application/json' -d "$body" -o /dev/null -w '%{http_code}')
          echo "완료 알림 → HTTP $code"
        env:
          WORKER_URL: https://realdealmap-trigger.jsmgames.workers.dev
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          SGG_CD: ${{ inputs.sggCd || github.event.client_payload.sggCd }}
          # 원천 불통은 잡이 성공으로 끝나도 배포는 안 된 것이다. 사실대로 적는다.
          OUTCOME: ${{ job.status == 'success' && steps.publish.outputs.code == '4' && 'upstream' || job.status }}

  # 원천에 닿지 못했으면 **새 러너에서 한 번만** 다시 돈다.
  #
  # 같은 러너에서 더 기다리는 것은 소용이 없었다 — 수집 스크립트가 이미 6번을
  # 백오프하며 재시도하고(약 100초) 포기한 것이다. 반면 같은 분에 다른 러너에서
  # 돈 실행은 닿았다. 새 실행은 새 러너를 받는다.
  #
  # 비밀을 쥔 refresh 잡과 떼어 둔다. 워크플로를 부르는 권한(actions: write)을
  # 국토부 인증키·R2 자격증명과 같은 잡에 두지 않기 위해서다.
  #
  # GITHUB_TOKEN으로 만든 이벤트는 대개 새 실행을 만들지 않지만
  # workflow_dispatch는 예외다. 무한 반복은 attempt 입력이 막는다.
  retry:
    needs: refresh
    if: needs.refresh.outputs.code == '4' && inputs.attempt != '2' && !inputs.dryRun
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: 새 러너에서 다시 돌린다
        # 다시 부르기가 실패해도 잡을 실패로 끝내지 않는다. 그러면 없애려던 실패
        # 메일이 이 경로로 되돌아온다. 못 불렀어도 앱이 60분 뒤 다시 요청한다.
        run: |
          if gh workflow run refresh-region.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f sggCd="$SGG_CD" -f months="$MONTHS" -f attempt=2; then
            echo "$SGG_CD 재시도를 요청했습니다."
          else
            echo "::warning::$SGG_CD 재시도를 요청하지 못했습니다. 앱이 60분 뒤 다시 요청합니다."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          SGG_CD: ${{ inputs.sggCd || github.event.client_payload.sggCd }}
          MONTHS: ${{ inputs.months || github.event.client_payload.months || '3' }}
